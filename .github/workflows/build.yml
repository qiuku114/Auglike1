name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: unzip source
        run: |
          ls -la
          for f in *.zip; do
            [ -f "$f" ] && echo "unzip $f" && unzip -o -q "$f"
          done
          if [ ! -f Makefile ] && [ -f aug_like/Makefile ]; then
            cp -r aug_like/* .
          fi
          ls -la
          test -f Makefile || (echo "Makefile missing" && exit 1)

      - name: install theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          SDK_URL=$(curl -sL https://api.github.com/repos/theos/sdks/releases/latest \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([a['browser_download_url'] for a in d['assets'] if 'iPhoneOS16.5.sdk' in a['name']][0])")
          echo "SDK: $SDK_URL"
          curl -L -o /tmp/sdk.tar.xz "$SDK_URL"
          tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: imgui
        run: git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git imgui

      - name: make
        run: make -j4

      - name: collect
        run: |
          mkdir -p dist
          find .theos -name "*.dylib" -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: AUGLike-dylib
          path: dist/*.dylib
          if-no-files-found: error
